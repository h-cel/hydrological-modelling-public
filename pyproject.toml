[build-system]
requires = ["setuptools>=64"]  # PEP 660 editable installs (pip install -e .)
build-backend = "setuptools.build_meta"

[project]
name = "hydromod"
version = "0.1.0"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
preview = true
extension = {qmd = "markdown" }
ignore = ["E703"] # Allow for semicolon use

[tool.ruff.lint]
ignore = ["E703"] # Allow for semicolon use
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["hydromod"]