on:
  workflow_dispatch:
  push:
    branches: main
    paths: # Only run the workflow if one of these files has changed
      - environment.yml
      - pyproject.toml
      - src/**
      - .github/workflows/test-install.yml
  pull_request:
    branches: main
    paths:
      - environment.yml
      - pyproject.toml
      - src/**
      - .github/workflows/test-install.yml

name: Test Conda Install

jobs:
  test-install:
    strategy:
      fail-fast: false
      matrix: # test on all relevant OS 
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python with Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: environment.yml
          activate-environment: hydromod_env
          conda-remove-defaults: true
          auto-activate-base: false

      - name: Show environment
        run: |
          conda info
          conda list

      - name: Smoke test imports
        run: python -c "import numpy, matplotlib, geopandas, rioxarray, geocube, openeo, contextily, pywaterinfo, rootutils, hydromod"

      - name: Check GRASS
        continue-on-error: ${{ matrix.os == 'windows-latest' }} # known broken on Windows
        run: python -c "from hydromod.helper_functions import find_grass_python_path; p = find_grass_python_path(); assert p, 'GRASS python path not found'; print(p)"
